name: Deploy Papastro GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'landingpage-sass/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile SASS & Assets
        run: |
          cd landingpage-sass
          npm install
          npm run build:css
          cd ..
          mkdir -p docs
          cp -r landingpage-sass/assets landingpage-sass/css landingpage-sass/js landingpage-sass/index.html landingpage-sass/.nojekyll docs/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './landingpage-sass'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

