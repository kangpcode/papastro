<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Papastro Primary Gradient -->
    <linearGradient id="papastroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#06b6d4;#8b5cf6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#06b6d4;#3b82f6;#ec4899" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Papastro Native Gradient -->
    <linearGradient id="papastroNativeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Go Fiber Gradient -->
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Goravel Gradient -->
    <linearGradient id="goravelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Laravel Gradient -->
    <linearGradient id="laravelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Express Gradient -->
    <linearGradient id="expressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Astro Gradient -->
    <linearGradient id="astroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Next.js Gradient -->
    <linearGradient id="nextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="statCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-size: 13px; fill: #94a3b8; }
    .label { font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .metric { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .submetric { font-size: 11px; fill: #94a3b8; }
    .grid-line { stroke: #1e293b; stroke-dasharray: 4 4; stroke-width: 1; }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.4)) drop-shadow(0 0 15px rgba(139, 92, 246, 0.2)); }
      50% { filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.8)) drop-shadow(0 0 25px rgba(236, 72, 153, 0.5)); }
    }
    
    @keyframes beaconRipple {
      0% { r: 4px; opacity: 1; }
      100% { r: 14px; opacity: 0; }
    }
    
    @keyframes scanLine {
      0% { x: 270; opacity: 0; }
      50% { opacity: 1; }
      100% { x: 745; opacity: 0; }
    }

    .papastro-bar-glow {
      animation: pulseGlow 3s infinite ease-in-out;
    }

    .beacon-circle {
      animation: beaconRipple 2s infinite cubic-bezier(0, 0.2, 0.8, 1);
    }

    .laser-scan {
      animation: scanLine 2.5s infinite linear;
    }
  </style>

  <!-- Main Card Container -->
  <rect x="10" y="10" width="920" height="580" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Ambient Top Glows -->
  <circle cx="150" cy="50" r="100" fill="#06b6d4" opacity="0.08" filter="blur(40px)" />
  <circle cx="780" cy="80" r="120" fill="#8b5cf6" opacity="0.08" filter="blur(50px)" />

  <!-- ================= HEADER SECTION ================= -->
  <!-- Live Status Badge -->
  <g transform="translate(40, 36)">
    <rect width="180" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#34d399" />
    <circle cx="14" cy="12" r="4" fill="none" stroke="#34d399" stroke-width="1.5" class="beacon-circle">
      <animate attributeName="r" values="4; 12" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1; 0" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16" class="font-sans" font-size="10" font-weight="700" fill="#34d399" letter-spacing="0.5">BENCHMARK TEST v4.0</text>
  </g>

  <!-- Environment Metadata Tag -->
  <g transform="translate(620, 36)">
    <rect width="280" height="24" rx="6" fill="#1e293b" />
    <text x="140" y="16" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#cbd5e1">
      wrk -t16 -c1000 -d30s • 100k Concurrency
    </text>
  </g>

  <!-- Main Title -->
  <text x="40" y="90" class="font-sans title" font-size="22">Papastro v4.0.0 High-Scale Concurrency Benchmark</text>
  <text x="40" y="110" class="font-sans subtitle">Throughput (Requests/sec), Latency P99, and Memory Footprint across Modern Web Frameworks</text>

  <!-- Grid Vertical Lines & Markers -->
  <g transform="translate(270, 135)">
    <!-- 0k -->
    <line x1="0" y1="0" x2="0" y2="310" class="grid-line" />
    <text x="0" y="325" text-anchor="middle" class="font-sans submetric">0</text>
    <!-- 30k -->
    <line x1="120" y1="0" x2="120" y2="310" class="grid-line" />
    <text x="120" y="325" text-anchor="middle" class="font-sans submetric">30k</text>
    <!-- 60k -->
    <line x1="240" y1="0" x2="240" y2="310" class="grid-line" />
    <text x="240" y="325" text-anchor="middle" class="font-sans submetric">60k</text>
    <!-- 90k -->
    <line x1="360" y1="0" x2="360" y2="310" class="grid-line" />
    <text x="360" y="325" text-anchor="middle" class="font-sans submetric">90k</text>
    <!-- 120k -->
    <line x1="480" y1="0" x2="480" y2="310" class="grid-line" />
    <text x="480" y="325" text-anchor="middle" class="font-sans submetric">120k req/s</text>
  </g>

  <!-- ================= BARS SECTION ================= -->
  <!-- 1. Go Fiber -->
  <g transform="translate(40, 142)">
    <text x="0" y="16" class="font-sans label">Go Fiber (Go 1.22)</text>
    <rect x="230" y="2" width="448" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="url(#fiberGrad)">
      <animate attributeName="width" from="0" to="448" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <text x="688" y="16" class="font-sans metric">112,000 <tspan class="submetric">(0.60ms • 15MB)</tspan></text>
  </g>

  <!-- 2. Papastro v4 (Octane + Pastroutine) - HIGHLIGHTED -->
  <g transform="translate(40, 176)" class="papastro-bar-glow">
    <rect x="-8" y="-4" width="876" height="32" rx="6" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="18" class="font-sans label" font-weight="700" fill="#38bdf8">Papastro v4 (Octane)</text>
    <rect x="230" y="2" width="421" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="url(#papastroGrad)">
      <animate attributeName="width" from="0" to="421" dur="1.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <rect x="230" y="2" width="40" height="20" rx="4" fill="#ffffff" opacity="0.35" class="laser-scan" filter="blur(3px)">
      <animate attributeName="x" values="230; 611; 230" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1; 0.6; 0.1" dur="2.8s" repeatCount="indefinite" />
    </rect>
    <text x="662" y="17" class="font-sans metric" fill="#38bdf8">105,400 <tspan class="submetric" fill="#a5f3fc">(0.65ms • 24MB) ★ FASTEST PHP</tspan></text>
  </g>

  <!-- 3. Goravel -->
  <g transform="translate(40, 214)">
    <text x="0" y="16" class="font-sans label">Goravel (Go 1.22)</text>
    <rect x="230" y="2" width="312" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="url(#goravelGrad)">
      <animate attributeName="width" from="0" to="312" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <text x="552" y="16" class="font-sans metric">78,000 <tspan class="submetric">(0.95ms • 22MB)</tspan></text>
  </g>

  <!-- 4. Papastro v4 (Native SO_REUSEPORT) -->
  <g transform="translate(40, 248)">
    <text x="0" y="16" class="font-sans label" fill="#7dd3fc">Papastro v4 (Native)</text>
    <rect x="230" y="2" width="217" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="url(#papastroNativeGrad)">
      <animate attributeName="width" from="0" to="217" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <text x="457" y="16" class="font-sans metric">54,200 <tspan class="submetric">(1.20ms • 28MB) Pure PHP</tspan></text>
  </g>

  <!-- 5. Laravel 11 Octane -->
  <g transform="translate(40, 282)">
    <text x="0" y="16" class="font-sans label">Laravel 11 (Octane)</text>
    <rect x="230" y="2" width="180" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="url(#laravelGrad)">
      <animate attributeName="width" from="0" to="180" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <text x="420" y="16" class="font-sans metric">45,000 <tspan class="submetric">(1.80ms • 95MB)</tspan></text>
  </g>

  <!-- 6. Express.js -->
  <g transform="translate(40, 316)">
    <text x="0" y="16" class="font-sans label">Express.js (Node 20)</text>
    <rect x="230" y="2" width="114" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="url(#expressGrad)">
      <animate attributeName="width" from="0" to="114" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <text x="354" y="16" class="font-sans metric">28,400 <tspan class="submetric">(4.20ms • 80MB)</tspan></text>
  </g>

  <!-- 7. Astro 4 SSR -->
  <g transform="translate(40, 350)">
    <text x="0" y="16" class="font-sans label">Astro 4 (Node SSR)</text>
    <rect x="230" y="2" width="96" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="url(#astroGrad)">
      <animate attributeName="width" from="0" to="96" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <text x="336" y="16" class="font-sans metric">24,000 <tspan class="submetric">(5.80ms • 120MB)</tspan></text>
  </g>

  <!-- 8. Next.js 14 -->
  <g transform="translate(40, 384)">
    <text x="0" y="16" class="font-sans label">Next.js 14 (Node SSR)</text>
    <rect x="230" y="2" width="47" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="url(#nextGrad)">
      <animate attributeName="width" from="0" to="47" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <text x="287" y="16" class="font-sans metric">11,800 <tspan class="submetric">(9.50ms • 180MB)</tspan></text>
  </g>

  <!-- 9. Laravel 11 PHP-FPM -->
  <g transform="translate(40, 418)">
    <text x="0" y="16" class="font-sans label">Laravel 11 (PHP-FPM)</text>
    <rect x="230" y="2" width="14" height="20" rx="4" fill="#0f172a" />
    <rect x="230" y="2" width="0" height="20" rx="4" fill="#991b1b">
      <animate attributeName="width" from="0" to="14" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
    </rect>
    <text x="254" y="16" class="font-sans metric">3,400 <tspan class="submetric">(28.0ms • 64MB)</tspan></text>
  </g>

  <!-- ================= FOOTER HIGHLIGHT CARDS ================= -->
  <g transform="translate(40, 480)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="272" height="76" rx="10" fill="url(#statCardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="20" y="28" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">MAX THROUGHPUT (RPS)</text>
      <text x="20" y="56" class="font-sans" font-size="24" font-weight="800" fill="#38bdf8">105,400+</text>
      <text x="145" y="54" class="font-sans submetric" fill="#34d399">↑ 2.3x vs Laravel</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(294, 0)">
      <rect width="272" height="76" rx="10" fill="url(#statCardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="20" y="28" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">MEMORY EFFICIENCY</text>
      <text x="20" y="56" class="font-sans" font-size="24" font-weight="800" fill="#a78bfa">~24 MB</text>
      <text x="135" y="54" class="font-sans submetric" fill="#34d399">~4x lighter Octane</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(588, 0)">
      <rect width="272" height="76" rx="10" fill="url(#statCardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="20" y="28" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">LATENCY P99 / KEEPALIVE</text>
      <text x="20" y="56" class="font-sans" font-size="24" font-weight="800" fill="#34d399">0.65 ms</text>
      <text x="135" y="54" class="font-sans submetric" fill="#94a3b8">100 req/socket</text>
    </g>
  </g>

  <!-- Creator Attribution Line -->
  <text x="470" y="582" text-anchor="middle" class="font-sans" font-size="10" fill="#64748b">
    Papastro v4.0.0 Architecture &amp; .pstro Format Engine &#8226; Designed &amp; Copyrighted by kangpcode (Dhafa Nazula Permadi)
  </text>
</svg>
